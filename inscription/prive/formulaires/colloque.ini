; =====================================================================
; Exemple de formulaire BILINGUE français / anglais.
; Adresse : index.php?f=colloque   (index.php?f=colloque&lang=en pour forcer l'anglais)
;
; - langues = "fr | en" : la première est la langue de base (textes sans suffixe) ;
; - chaque texte peut être traduit en ajoutant _en à sa clé : titre_en, libelle_en, aide_en,
;   options_en (même nombre de choix, dans le même ordre), gauche_en, droite_en… ;
; - le visiteur voit la langue de son navigateur et peut changer par un lien en haut de page ;
; - les réponses sont TOUJOURS enregistrées dans la langue de base (colonnes homogènes),
;   avec une colonne « langue » indiquant la langue utilisée par le répondant ;
; - un texte non traduit s'affiche dans la langue de base.
; =====================================================================

[formulaire]
langues  = "fr | en"
titre    = "Colloque « Patrimoine et numérique » — 20 mars 2027"
titre_en = "Symposium “Heritage and digital” — 20 March 2027"
intro    = "Inscription gratuite mais obligatoire. Les interventions sont traduites simultanément."
intro_en = "Free but compulsory registration. Talks are interpreted simultaneously."
merci    = "Merci ! Vous recevrez le programme détaillé une semaine avant le colloque."
merci_en = "Thank you! You will receive the detailed programme one week before the symposium."
bouton    = "S'inscrire"
bouton_en = "Register"
fermeture = "2027-03-13"
places    = 150

[nom]
type        = texte
libelle     = "Nom et prénom"
libelle_en  = "Full name"
obligatoire = oui

[email]
type        = email
libelle     = "Adresse électronique"
libelle_en  = "E-mail address"
exemple     = "prenom.nom@exemple.fr"
exemple_en  = "firstname.lastname@example.org"
obligatoire = oui
unique      = oui

[pays]
type       = texte
libelle    = "Pays"
libelle_en = "Country"

[statut]
type        = choix
libelle     = "Vous êtes :"
libelle_en  = "You are:"
options     = "Chercheur ou enseignant | Étudiant | Professionnel du patrimoine | Autre"
options_en  = "Researcher or lecturer | Student | Heritage professional | Other"
obligatoire = oui

[etablissement]
type       = texte
libelle    = "Établissement ou organisme"
libelle_en = "Institution or organisation"
si         = "statut != Autre"

[sessions]
type        = cases
libelle     = "Sessions auxquelles vous assisterez"
libelle_en  = "Sessions you will attend"
options     = "Matin : numérisation | Après-midi : médiation | Table ronde de clôture"
options_en  = "Morning: digitisation | Afternoon: outreach | Closing round table"
obligatoire = oui

[langue_interpretation]
type        = liste
libelle     = "Casque d'interprétation"
libelle_en  = "Interpretation headset"
aide        = "Les interventions ont lieu en français ou en anglais."
aide_en     = "Talks are given in French or English."
options     = "Pas besoin | Vers le français | Vers l'anglais"
options_en  = "Not needed | Into French | Into English"

[dejeuner]
type       = case
libelle    = "Je reste au déjeuner (buffet offert)"
libelle_en = "I will stay for lunch (free buffet)"

[regime]
type       = liste
libelle    = "Régime alimentaire"
libelle_en = "Dietary requirements"
options    = "Aucun | Végétarien | Végétalien | Sans gluten"
options_en = "None | Vegetarian | Vegan | Gluten-free"
si         = "dejeuner = oui"

[interet]
type       = echelle
libelle    = "Votre intérêt pour le thème"
libelle_en = "Your interest in the topic"
gauche     = "Faible"
gauche_en  = "Low"
droite     = "Très fort"
droite_en  = "Very high"

[rgpd]
type        = case
libelle     = "J'accepte que mes données soient utilisées pour l'organisation du colloque."
libelle_en  = "I agree that my data is used to organise the symposium."
obligatoire = oui
