; Example written entirely in English: English keys, English types,
; and "language = en" for the interface texts (buttons, messages, errors).
; Address: index.php?f=meeting-en

[form]
title    = "Annual meeting — registration"
intro    = "Please register before 30 November."
language = en
thanks   = "Thank you! See you at the meeting."
button   = "Register"
closes   = "2026-11-30"
listed   = yes

[name]
type     = text
label    = "Full name"
required = yes

[email]
type     = email
label    = "E-mail address"
required = yes
unique   = yes

[attend]
type     = choice
label    = "Will you attend?"
options  = "Yes | No | Not sure yet"
required = yes

[meal]
type    = dropdown
label   = "Lunch"
options = "Standard | Vegetarian | No lunch"
if      = "attend = Yes | Not sure yet"

[interest]
type  = scale
label = "How interested are you in this year's topics?"
left  = "Not at all"
right = "Very"

[consent]
type     = consent
label    = "I agree that my data is used to organise the meeting."
required = yes
