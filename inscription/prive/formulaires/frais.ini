; =====================================================================
; Exemple de MONTANTS et d'HEURES : demande de remboursement de frais de déplacement (données fictives).
; Adresse : index.php?f=frais
;
; - type = montant : somme d'argent, symbole de config.php (devise) affiché après la zone ;
;   accepte 12, 12,5, 12.50 ou « 1 250,00 € » ; enregistré avec deux décimales (12,50) ;
;   jamais négatif, sauf si min l'autorise ; min / max possibles ;
; - type = heure : sélecteur d'heure du navigateur ; accepte aussi 9h, 9h05, 14:30 ; enregistré en HH:MM ;
;   min / max : plage horaire acceptée ;
; - les deux peuvent servir de condition : si = "montant_transport > 100", si = "depart < 07:00".
; =====================================================================

[formulaire]
titre  = "Remboursement de frais de déplacement"
intro  = "Remplissez une demande par déplacement. Les montants sont à indiquer TTC."
bouton = "Envoyer la demande"

[nom]
type        = texte
libelle     = "Nom et prénom"
obligatoire = oui

[jour]
type        = date
libelle     = "Date du déplacement"
obligatoire = oui

[depart]
type        = heure
libelle     = "Heure de départ"
obligatoire = oui

[retour]
type        = heure
libelle     = "Heure de retour"
min         = 06:00
max         = 23:30

[repas_tot]
type    = info
libelle = "Départ avant 7 h : le petit-déjeuner peut être remboursé (joindre le ticket)."
si      = "depart < 07:00"

[transport]
type        = montant
libelle     = "Frais de transport (train, péage, carburant…)"
obligatoire = oui
max         = 2000
exemple     = "0,00"

[repas]
type    = montant
libelle = "Frais de repas"
aide    = "Remboursés dans la limite de 25 € par repas."
max     = 75

[justificatif]
type    = info
libelle = "Au-delà de 100 € de transport, merci d'envoyer les justificatifs au trésorier."
si      = "transport > 100"

[remarques]
type    = texte_long
libelle = "Remarques"
