; =====================================================================
; Exemple complet : inscription à une journée associative.
; Adresse : index.php?f=exemple   (nom du fichier sans .ini)
; Les lignes commençant par ; sont des commentaires.
; Mettez toujours les textes entre guillemets doubles "…".
; =====================================================================

[formulaire]
titre     = "test tif"
intro     = "Merci de remplir ce formulaire pour participer.
Les champs marqués d'une étoile sont obligatoires."
merci     = "Merci ! Votre inscription est bien enregistrée. À bientôt."
bouton    = "Je m'inscris"
; nom du fichier de données (donnees/journee-2026.csv) ; par défaut : le nom du formulaire
fichier   = "journee-2026"
; inscriptions possibles entre ces dates (facultatif)
fermeture = "2026-12-10"
; nombre maximal d'inscriptions (facultatif, 0 = illimité)
places    = 120
; diffusion = oui (défaut) : affiché dans la liste de index.php
; diffusion = non : accessible uniquement par le lien de partage donné dans admin.php
diffusion = oui
; recevoir un courriel à chaque inscription (facultatif)
; notifier = "contact@mon-asso.fr"

[sec_identite]
type    = titre
libelle = "Vous"

[profil]
type        = choix
libelle     = "Vous venez en tant que :"
options     = "Particulier | Association | Bénévole"
obligatoire = oui

[association]
type        = texte
libelle     = "Nom de l'association"
obligatoire = oui
si          = "profil = Association"

[nom]
type        = texte
libelle     = "Nom et prénom"
obligatoire = oui

[email]
type        = email
libelle     = "Adresse électronique"
obligatoire = oui
unique      = oui
exemple     = "prenom.nom@exemple.fr"

[telephone]
type    = telephone
libelle = "Téléphone"
aide    = "Uniquement pour vous joindre le jour même."

[sec_venue]
type    = titre
libelle = "Votre venue"

[creneaux]
type        = cases
libelle     = "Créneaux de présence"
options     = "Matin | Midi | Après-midi"
obligatoire = oui

[repas]
type        = liste
libelle     = "Repas de midi"
options     = "Normal | Végétarien | Sans porc"
obligatoire = oui
si          = "creneaux = Midi"

[personnes]
type        = nombre
libelle     = "Nombre de personnes (vous compris)"
min         = 1
max         = 10
defaut      = 1
obligatoire = oui

[stand]
type    = choix
libelle = "Souhaitez-vous un stand ?"
options = "Oui | Non"
si      = "profil = Association"

[taille_stand]
type    = liste
libelle = "Taille du stand"
options = "1 table | 2 tables | 3 tables"
si      = "profil = Association & stand = Oui"

[arrivee]
type    = date
libelle = "Date d'arrivée (si vous venez la veille)"
min     = "2026-12-11"
max     = "2026-12-12"

[remarques]
type    = texte_long
libelle = "Remarques ou questions"
max     = 1000

[info_rgpd]
type    = info
libelle = "Vos données servent uniquement à l'organisation de la journée et seront supprimées un mois après."

[rgpd]
type        = case
libelle     = "J'accepte que mes données soient utilisées pour l'organisation de la journée."
obligatoire = oui
