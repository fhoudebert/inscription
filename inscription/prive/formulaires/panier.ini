; =====================================================================
; Exemple de formulaire de COMMANDE : le panier de la semaine d'un maraîcher.
; Adresse : index.php?f=panier
;
; - le champ de type « commande » affiche les produits DISPONIBLES du catalogue
;   prive/catalogues/legumes.csv (prix, unité, pas de quantité), avec le total estimé ;
; - le catalogue se met à jour chaque semaine dans admin.php (rubrique Catalogues) :
;   prix et case « disponible » ;
; - admin.php → Commandes : liste, quantités à préparer par produit, prix définitif
;   par ligne (pesée), statut, et message prêt à copier dans un SMS ou un e-mail.
; Logo : image de prive/images/ (admin.php → Images) ; logo = non pour aucun logo.
; Données fictives : l'exemple vaut pour n'importe quelle commande (boulangerie, AMAP…).
;
; Accès réservé aux clients (facultatif) : ajoutez « acces = lien » dans [formulaire]
; (ou, dans l'éditeur : Réglages du formulaire → Diffusion et accès → Qui peut répondre),
; puis créez les accès dans admin.php à partir de la liste des clients (« Marie Durand ; marie@exemple.fr », « Jean Martin 06 12 34 56 78 »…) :
; chacun reçoit un lien personnel, ses nom, téléphone et e-mail sont déjà remplis (et ne sont
; plus obligatoires), et il peut revenir modifier sa commande jusqu'à la préparation.
; =====================================================================

[formulaire]
titre   = "Panier de la semaine"
logo    = "exemple-panier.png"
logo_texte = "Les jardins de l'exemple"
intro   = "Commandez avant jeudi midi, retrait vendredi. Les prix au kilo sont indicatifs : le montant exact est calculé à la pesée."
bouton  = "Envoyer ma commande"
merci   = "Merci ! Votre commande est enregistrée. Vous recevrez un message quand elle sera prête."
message = "Bonjour {nom},
Votre commande n° {numero} est prête :
{detail}
Total à régler : {total}
{note}
À vendredi !"

[nom]
type        = texte
libelle     = "Nom et prénom"
obligatoire = oui

[telephone]
type        = telephone
libelle     = "Téléphone"
aide        = "Pour vous prévenir quand la commande est prête."
obligatoire = oui

[email]
type    = email
libelle = "Adresse électronique (facultatif)"

[retrait]
type        = choix
libelle     = "Retrait"
options     = "Vendredi à la ferme (16 h – 19 h) | Samedi au marché (8 h – 12 h)"
obligatoire = oui

[panier]
type        = commande
libelle     = "Votre commande"
aide        = "Indiquez la quantité des produits qui vous intéressent."
catalogue   = legumes
obligatoire = oui

[remarques]
type    = texte_long
libelle = "Remarques (préférences, substitutions…)"
max     = 500
