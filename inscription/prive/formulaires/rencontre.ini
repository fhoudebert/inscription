; =====================================================================
; Exemple de GRILLES (tableaux de choix) : rencontre sur un week-end de trois jours.
; Adresse : index.php?f=rencontre
;
; - type = grille : une ligne par question (lignes = …), une colonne par réponse (colonnes = …) ;
;   un bouton par case, une seule réponse par ligne ; multiple = oui : cases à cocher, plusieurs réponses par ligne ;
; - obligatoire = oui : chaque ligne doit recevoir une réponse ;
; - fichier de réponses : une colonne par ligne de la grille, nommée <champ>_<ligne>
;   (vehiculer_vendredi, vehiculer_samedi, vehiculer_dimanche, repas_vendredi…) ;
; - sur téléphone, les lignes s'affichent l'une sous l'autre.
; Liens : [texte](https://…) ou adresse nue https://… dans intro, aide, info, case, merci.
; Voir aussi [info_gite] : condition sur deux champs avec une comparaison de nombre (groupe > 4).
; =====================================================================

[formulaire]
titre  = "Rencontre d'automne — du vendredi au dimanche"
intro  = "Programme et plan d'accès : [site de la rencontre](https://exemple.org/rencontre). Indiquez vos jours de présence, vos repas et, si vous venez en voiture, si vous pouvez emmener d'autres convives."
bouton = "Je m'inscris"
; Courriel de confirmation au répondant, envoyé à l'adresse du champ [email] (premier champ email)
confirmation = oui
confirmation_texte = "Merci, votre inscription à la rencontre d'automne est enregistrée. Programme : https://exemple.org/programme"

[nom]
type        = texte
libelle     = "Nom et prénom"
obligatoire = oui

[email]
type        = email
libelle     = "Adresse électronique"
obligatoire = oui

[presence]
type        = grille
libelle     = "Serez-vous présent(e) ?"
lignes      = "Vendredi | Samedi | Dimanche"
colonnes    = "Oui | Non | Peut-être"
obligatoire = oui

[repas]
type     = grille
libelle  = "Repas souhaités"
aide     = "Cochez tous les repas que vous prendrez sur place."
lignes   = "Vendredi | Samedi | Dimanche"
colonnes = "Déjeuner | Dîner"
multiple = oui

[vehicule]
type        = choix
libelle     = "Venez-vous en voiture ?"
options     = "Oui | Non"
obligatoire = oui

[vehiculer]
type        = grille
libelle     = "Si des convives ne sont pas véhiculés, êtes-vous disponible pour les véhiculer ?"
lignes      = "Vendredi | Samedi | Dimanche"
colonnes    = "Oui | Non"
obligatoire = oui
si          = "vehicule = Oui"

[groupe]
type    = nombre
libelle = "Nombre de personnes (vous compris)"
min     = 1
max     = 30
entier  = oui
defaut  = 1

[hebergement]
type    = choix
libelle = "Souhaitez-vous être hébergé(e) sur place ?"
options = "Oui | Non"

; Comparaison de nombres : < <= > >= (aussi = et !=), sur un champ nombre, date ou échelle de notes ;
; & : les deux conditions à la fois. Tant que le nombre n'est pas saisi, la condition est fausse.
[info_gite]
type    = info
libelle = "Pour un groupe de plus de 4 personnes, nous vous proposons le gîte entier : nous vous contacterons."
si      = "hebergement = Oui & groupe > 4"

[reglement]
type        = case
libelle     = "J'ai lu le [règlement de la rencontre](https://exemple.org/reglement) et je l'accepte"
obligatoire = oui

[remarques]
type    = texte_long
libelle = "Remarques"
