; =====================================================================
; Exemple de GRILLES (tableaux de choix) : rencontre sur un week-end de trois jours.
; Adresse : index.php?f=rencontre
;
; - type = grille : une ligne par question (lignes = …), une colonne par réponse (colonnes = …) ;
;   un bouton par case, une seule réponse par ligne ; multiple = oui : cases à cocher, plusieurs réponses par ligne ;
; - obligatoire = oui : chaque ligne doit recevoir une réponse ;
; - fichier de réponses : une colonne par ligne de la grille, nommée <champ>_<ligne>
;   (vehiculer_vendredi, vehiculer_samedi, vehiculer_dimanche, repas_vendredi…) ;
; - sur téléphone, les lignes s'affichent l'une sous l'autre.
; =====================================================================

[formulaire]
titre  = "Rencontre d'automne — du vendredi au dimanche"
intro  = "Indiquez vos jours de présence, vos repas et, si vous venez en voiture, si vous pouvez emmener d'autres convives."
bouton = "Je m'inscris"

[nom]
type        = texte
libelle     = "Nom et prénom"
obligatoire = oui

[email]
type        = email
libelle     = "Adresse électronique"
obligatoire = oui

[presence]
type        = grille
libelle     = "Serez-vous présent(e) ?"
lignes      = "Vendredi | Samedi | Dimanche"
colonnes    = "Oui | Non | Peut-être"
obligatoire = oui

[repas]
type     = grille
libelle  = "Repas souhaités"
aide     = "Cochez tous les repas que vous prendrez sur place."
lignes   = "Vendredi | Samedi | Dimanche"
colonnes = "Déjeuner | Dîner"
multiple = oui

[vehicule]
type        = choix
libelle     = "Venez-vous en voiture ?"
options     = "Oui | Non"
obligatoire = oui

[vehiculer]
type        = grille
libelle     = "Si des convives ne sont pas véhiculés, êtes-vous disponible pour les véhiculer ?"
lignes      = "Vendredi | Samedi | Dimanche"
colonnes    = "Oui | Non"
obligatoire = oui
si          = "vehicule = Oui"

[remarques]
type    = texte_long
libelle = "Remarques"
