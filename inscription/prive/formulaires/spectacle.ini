; =====================================================================
; Exemple de RÉSERVATION avec PRIX TOTAL CALCULÉ : places pour un spectacle (données fictives).
; Adresse : index.php?f=spectacle
;
; - type = total : montant calculé à partir d'autres champs, affiché en direct pendant la saisie
;   et recalculé par le serveur à l'envoi (la valeur envoyée par le navigateur n'est jamais crue) ;
; - calcul = termes « champ * prix unitaire » séparés par + ou - ; un nombre seul = frais fixes ;
;   les champs cités sont des nombres, montants ou totaux décrits AVANT ; vide ou masqué = 0 ;
; - le total est enregistré dans le fichier de réponses (colonne « total ») et figure dans les courriels ;
; - il peut servir de condition : si = "total > 100".
; =====================================================================

[formulaire]
titre        = "Réservation — Le Petit Théâtre de l'exemple"
intro        = "Réservez vos places pour « La Lune en voyage », conte musical tout public (durée 1 h 10)."
bouton       = "Réserver"
merci        = "Votre réservation est enregistrée. Les billets sont à retirer et à régler à l'accueil, au plus tard 20 minutes avant le début."
confirmation = oui

[nom]
type        = texte
libelle     = "Nom et prénom"
obligatoire = oui

[email]
type        = email
libelle     = "Adresse électronique"
aide        = "Un courriel récapitulatif vous sera envoyé."
obligatoire = oui

[telephone]
type    = telephone
libelle = "Téléphone"
aide    = "Pour vous prévenir en cas d'annulation."

[representation]
type        = date
libelle     = "Date de la représentation"
aide        = "Représentations du 4 au 20 décembre 2026."
min         = 2026-12-04
max         = 2026-12-20
obligatoire = oui

[tarifs]
type    = info
libelle = "Tarifs : adulte 15 €, enfant de moins de 12 ans 8 €. Placement libre. Les enfants doivent être accompagnés d'un adulte."

[adultes]
type        = nombre
libelle     = "Nombre de places adultes"
entier      = oui
min         = 1
max         = 10
defaut      = 1
obligatoire = oui

[enfants]
type    = nombre
libelle = "Nombre de places enfants (moins de 12 ans)"
entier  = oui
min     = 0
max     = 10
defaut  = 0

[total]
type    = total
libelle = "Prix total"
calcul  = "adultes * 15 + enfants * 8"
aide    = "À régler sur place (espèces, chèque ou carte)."

[groupe]
type    = info
libelle = "À partir de 100 €, contactez-nous pour bénéficier du tarif de groupe."
si      = "total >= 100"

[remarques]
type    = texte_long
libelle = "Remarques (accès en fauteuil, poussette…)"
